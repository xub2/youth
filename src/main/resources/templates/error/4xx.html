<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>페이지 접근 오류</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" as="style" crossorigin
          href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
    <style>
        :root {
            --bg: #F2EFE9;
            --surface: #FFFFFF;
            --ink: #1A1A1A;
            --ink-2: #6B6B6B;
            --ink-3: #B5B2AD;
            --coral: #F5906A;
            --coral-10: rgba(245,144,106,0.10);
            --border: rgba(0,0,0,0.07);
            --radius-sm: 14px;
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100dvh;
            background: var(--bg);
            color: var(--ink);
            font-family: 'Pretendard', -apple-system, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 32px 24px;
        }

        .error-wrap { max-width: 440px; }

        .error-code {
            font-family: 'Caveat', cursive;
            font-weight: 700;
            font-size: clamp(5.5rem, 22vw, 9rem);
            color: var(--coral);
            line-height: 1;
            margin-bottom: 6px;
            letter-spacing: -2px;
        }

        .error-title {
            font-size: clamp(1.1rem, 3vw, 1.4rem);
            font-weight: 700;
            color: var(--ink);
            margin-bottom: 14px;
        }

        .error-desc {
            font-size: 0.9rem;
            color: var(--ink-2);
            line-height: 1.85;
            margin-bottom: 36px;
            word-break: keep-all;
        }

        .btn-home {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            height: 50px;
            padding: 0 30px;
            background: var(--coral);
            color: #fff;
            border: none;
            border-radius: 999px;
            font-family: 'Pretendard', sans-serif;
            font-weight: 700;
            font-size: 0.9rem;
            text-decoration: none;
            box-shadow: 0 4px 18px rgba(245,144,106,0.35);
            transition: opacity 0.15s, transform 0.1s;
        }
        .btn-home:hover { opacity: 0.88; transform: translateY(-1px); color: #fff; }
        .btn-home:active { transform: translateY(0); }
    </style>
</head>
<body>
<div class="error-wrap">
    <div class="error-code" th:text="${status ?: '4xx'}">4xx</div>

    <h2 class="error-title"
        th:text="${status != null && status == 403} ? '접근 권한이 없습니다.' : '요청하신 페이지를 찾을 수 없습니다.'">
        요청하신 페이지를 찾을 수 없습니다.
    </h2>

    <p class="error-desc">
        <span th:if="${status != null && status == 403}">
            해당 페이지에 접근할 수 있는 권한이 없습니다.<br>
            로그인 상태를 확인하거나 관리자에게 문의해 주세요.
        </span>
        <span th:unless="${status != null && status == 403}">
            입력하신 주소가 정확한지 다시 한번 확인해 주세요.<br>
            문제가 계속되면 관리자에게 알려주시면 도움이 됩니다.
        </span>
    </p>

    <a th:href="@{/}" class="btn-home">홈으로 돌아가기</a>
</div>
</body>
</html>
