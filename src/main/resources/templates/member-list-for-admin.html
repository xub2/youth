<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>출석 명단 관리</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="icon" th:href="@{/images/favicon.ico}" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" as="style" crossorigin
          href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
    <style>
        :root {
            --bg: #F2EFE9;
            --surface: #FFFFFF;
            --surface-2: #F8F6F2;
            --ink: #1A1A1A;
            --ink-2: #6B6B6B;
            --ink-3: #B5B2AD;
            --coral: #F5906A;
            --coral-10: rgba(245,144,106,0.10);
            --green: #22C55E;
            --green-10: rgba(34,197,94,0.10);
            --amber: #F59E0B;
            --amber-10: rgba(245,158,11,0.10);
            --border: rgba(0,0,0,0.07);
            --radius: 20px;
            --radius-sm: 12px;
            --sh-sm: 0 2px 8px rgba(0,0,0,0.06);
            --sh: 0 4px 24px rgba(0,0,0,0.08);
        }
        *, *::before, *::after { box-sizing: border-box; }
        body {
            background: var(--bg);
            color: var(--ink);
            font-family: 'Pretendard', -apple-system, sans-serif;
            line-height: 1.6;
            min-height: 100dvh;
        }

        /* ── top nav ── */
        .top-nav {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 0 24px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .nav-wordmark {
            font-family: 'Gaegu', cursive;
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--ink);
            text-decoration: none;
        }
        .nav-wordmark em { color: var(--coral); font-style: normal; }
        .nav-links { display: flex; gap: 6px; }
        .nav-btn {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            height: 36px;
            padding: 0 14px;
            border: 1.5px solid var(--border);
            border-radius: 999px;
            background: transparent;
            font-family: 'Pretendard', sans-serif;
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--ink-2);
            text-decoration: none;
            cursor: pointer;
            transition: background 0.12s, color 0.12s, border-color 0.12s;
        }
        .nav-btn:hover { background: var(--surface-2); color: var(--ink); border-color: rgba(0,0,0,0.12); }
        .nav-btn.coral { background: var(--coral); border-color: var(--coral); color: #fff; }
        .nav-btn.coral:hover { opacity: 0.88; color: #fff; }

        /* ── wrap ── */
        .wrap { max-width: 1000px; margin: 0 auto; padding: 0 24px 80px; }

        /* ── page head ── */
        .page-head {
            padding: 40px 0 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }
        .page-title {
            font-family: 'Gaegu', cursive;
            font-size: clamp(1.6rem, 4vw, 2.1rem);
            font-weight: 700;
            margin: 0;
        }
        .page-head-actions { display: flex; gap: 8px; flex-wrap: wrap; }

        /* ── section card ── */
        .surf-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--sh-sm);
            overflow: hidden;
            margin-bottom: 20px;
        }
        .surf-card-head {
            padding: 16px 24px;
            border-bottom: 1px solid var(--border);
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--ink-2);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .surf-card-body { padding: 20px 24px; }

        /* ── form elements ── */
        .field-input {
            width: 100%;
            height: 46px;
            padding: 0 16px;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            background: var(--surface-2);
            font-family: 'Pretendard', sans-serif;
            font-size: 0.93rem;
            color: var(--ink);
            outline: none;
            transition: border-color 0.15s, box-shadow 0.15s;
        }
        .field-input::placeholder { color: var(--ink-3); }
        .field-input:focus {
            border-color: var(--coral);
            box-shadow: 0 0 0 3px var(--coral-10);
            background: var(--surface);
        }

        /* ── buttons ── */
        .btn-primary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            height: 46px;
            padding: 0 22px;
            background: var(--coral);
            color: #fff;
            border: none;
            border-radius: var(--radius-sm);
            font-family: 'Pretendard', sans-serif;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            white-space: nowrap;
            box-shadow: 0 4px 14px rgba(245,144,106,0.28);
            transition: opacity 0.15s, transform 0.1s;
            text-decoration: none;
        }
        .btn-primary:hover { opacity: 0.88; transform: translateY(-1px); color: #fff; }
        .btn-primary:active { transform: translateY(0); }
        .btn-primary.w-full { width: 100%; }

        .btn-ghost {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            height: 36px;
            padding: 0 14px;
            background: transparent;
            border: 1.5px solid var(--border);
            border-radius: 999px;
            font-family: 'Pretendard', sans-serif;
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--ink-2);
            text-decoration: none;
            cursor: pointer;
            transition: background 0.12s, border-color 0.12s, color 0.12s;
        }
        .btn-ghost:hover { background: var(--surface-2); color: var(--ink); border-color: rgba(0,0,0,0.14); }

        /* ── stats row ── */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }
        @media (max-width: 640px) { .stats-row { grid-template-columns: repeat(2, 1fr); } }
        .stat-mini {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 16px 18px;
            box-shadow: var(--sh-sm);
        }
        .stat-mini-label {
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--ink-3);
            margin-bottom: 5px;
        }
        .stat-mini-val {
            font-family: 'Gaegu', cursive;
            font-size: 1.9rem;
            line-height: 1;
        }
        .val-coral  { color: var(--coral); }
        .val-ink    { color: var(--ink-2); }
        .val-green  { color: var(--green); }
        .val-amber  { color: var(--amber); }

        /* ── error alert ── */
        .alert-err {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 16px;
            background: rgba(245,144,106,0.08);
            border: 1.5px solid rgba(245,144,106,0.35);
            border-radius: var(--radius-sm);
            color: var(--coral);
            font-size: 0.85rem;
            margin-top: 14px;
        }

        /* ── table ── */
        .table-wrap {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--sh-sm);
            overflow: hidden;
            margin-bottom: 20px;
        }
        .tbl {
            width: 100%;
            border-collapse: collapse;
        }
        .tbl thead th {
            padding: 13px 20px;
            text-align: left;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--ink-3);
            background: var(--surface-2);
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
        }
        .tbl thead th.center { text-align: center; }
        .tbl tbody td {
            padding: 13px 20px;
            vertical-align: middle;
            border-bottom: 1px solid var(--border);
            color: var(--ink);
            font-size: 0.9rem;
        }
        .tbl tbody tr:last-child td { border-bottom: none; }
        .tbl tbody tr:hover td { background: rgba(0,0,0,0.015); }
        .tbl td.center { text-align: center; }

        .member-name-text {
            font-weight: 700;
            font-size: 0.95rem;
        }
        .badge-excluded {
            display: inline-block;
            font-size: 0.68rem;
            font-weight: 700;
            background: var(--surface-2);
            border: 1px solid var(--border);
            color: var(--ink-3);
            padding: 2px 9px;
            border-radius: 999px;
            margin-left: 6px;
        }
        .row-num {
            font-size: 0.82rem;
            color: var(--ink-3);
        }

        /* ── toggle buttons ── */
        .btn-toggle {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            height: 32px;
            padding: 0 13px;
            border-radius: 999px;
            font-family: 'Pretendard', sans-serif;
            font-size: 0.78rem;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            min-width: 88px;
            transition: background 0.12s, border-color 0.12s, color 0.12s, transform 0.1s;
        }
        .btn-toggle:hover { transform: translateY(-1px); }
        .btn-toggle:active { transform: translateY(0); }

        /* default state (positive / 정상) */
        .toggle-ok {
            background: var(--green-10);
            border: 1.5px solid rgba(34,197,94,0.35);
            color: var(--green);
        }
        .toggle-ok:hover { background: var(--green); color: #fff; border-color: var(--green); }

        /* active state (warning / 변경됨) */
        .toggle-warn {
            background: var(--coral-10);
            border: 1.5px solid rgba(245,144,106,0.4);
            color: var(--coral);
        }
        .toggle-warn:hover { background: var(--coral); color: #fff; border-color: var(--coral); }

        /* delete button */
        .btn-del {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            height: 30px;
            padding: 0 11px;
            border: 1.5px solid rgba(245,144,106,0.3);
            border-radius: 999px;
            background: transparent;
            font-family: 'Pretendard', sans-serif;
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--coral);
            cursor: pointer;
            transition: background 0.12s, color 0.12s;
        }
        .btn-del:hover { background: var(--coral); color: #fff; border-color: var(--coral); }

        /* ── danger zone ── */
        .danger-zone {
            background: rgba(245,144,106,0.06);
            border: 1.5px solid rgba(245,144,106,0.25);
            border-radius: var(--radius);
            padding: 24px 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        .danger-title {
            font-weight: 700;
            color: var(--coral);
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 7px;
        }
        .danger-desc { font-size: 0.82rem; color: var(--ink-2); margin: 0; }

        .btn-danger {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            height: 44px;
            padding: 0 22px;
            background: var(--coral);
            color: #fff;
            border: none;
            border-radius: var(--radius-sm);
            font-family: 'Pretendard', sans-serif;
            font-weight: 700;
            font-size: 0.88rem;
            cursor: pointer;
            white-space: nowrap;
            transition: opacity 0.15s, transform 0.1s;
        }
        .btn-danger:hover { opacity: 0.88; transform: translateY(-1px); }
        .btn-danger:active { transform: translateY(0); }

        .admin-note {
            text-align: right;
            font-size: 0.75rem;
            color: var(--ink-3);
        }

        .d-none-sm { display: none; }
        @media (min-width: 768px) { .d-none-sm { display: table-cell; } }
    </style>
</head>
<body>

<!-- Top nav -->
<nav class="top-nav">
    <a th:href="@{/}" class="nav-wordmark">랜덤 목장 <em>편성기</em></a>
    <div class="nav-links">
        <a th:href="@{/member/export}" class="nav-btn coral">
            <i class="bi bi-file-earmark-arrow-down"></i>
            <span class="d-none d-sm-inline">CSV 다운로드</span>
        </a>
        <a th:href="@{/}" class="nav-btn">
            <i class="bi bi-house"></i>
            <span class="d-none d-sm-inline">메인</span>
        </a>
    </div>
</nav>

<div class="wrap">

    <!-- Page head -->
    <div class="page-head">
        <h1 class="page-title">
            <i class="bi bi-person-lines-fill me-2" style="color:var(--coral);font-size:0.9em;"></i>
            주일 예배 출석 명단
        </h1>
    </div>

    <!-- Add member form -->
    <div class="surf-card">
        <div class="surf-card-head">
            <i class="bi bi-person-plus"></i> 출석 인원 등록
        </div>
        <div class="surf-card-body">
            <form th:action="@{/member/add}" method="post">
                <div class="row g-3 align-items-end">
                    <div class="col-md-9">
                        <input type="text" name="name" class="field-input"
                               placeholder="이름을 입력하세요" required>
                    </div>
                    <div class="col-md-3">
                        <button type="submit" class="btn-primary w-full">
                            <i class="bi bi-plus-lg"></i> 등록하기
                        </button>
                    </div>
                </div>
                <div th:if="${error}" class="alert-err">
                    <i class="bi bi-exclamation-circle"></i>
                    <span th:text="${error}">에러</span>
                </div>
            </form>
        </div>
    </div>

    <!-- Stats -->
    <div class="stats-row">
        <div class="stat-mini">
            <div class="stat-mini-label">전체 인원</div>
            <div class="stat-mini-val val-coral" th:text="${members.size()} + '명'">0명</div>
        </div>
        <div class="stat-mini">
            <div class="stat-mini-label">편성 대상</div>
            <div class="stat-mini-val val-ink"
                 th:text="${#lists.size(members.?[!excluded])} + '명'">0명</div>
        </div>
        <div class="stat-mini">
            <div class="stat-mini-label">리더 가능</div>
            <div class="stat-mini-val val-green"
                 th:text="${#lists.size(members.?[!excluded and !isHard])} + '명'">0명</div>
        </div>
        <div class="stat-mini">
            <div class="stat-mini-label">리더 불가</div>
            <div class="stat-mini-val val-amber"
                 th:text="${#lists.size(members.?[!excluded and isHard])} + '명'">0명</div>
        </div>
    </div>

    <!-- Member table -->
    <div class="table-wrap">
        <table class="tbl">
            <thead>
                <tr>
                    <th class="d-none-sm" style="width:48px;">#</th>
                    <th>이름</th>
                    <th class="center">리더 설정</th>
                    <th class="center">편성 설정</th>
                    <th class="center" style="width:72px;">삭제</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="member, stat : ${members}">
                    <td class="d-none-sm row-num" th:text="${stat.count}">1</td>
                    <td>
                        <span class="member-name-text" th:text="${member.name}">이름</span>
                        <span th:if="${member.excluded}" class="badge-excluded">편성 제외</span>
                    </td>
                    <td class="center">
                        <form th:action="@{/member/hard/{id}(id=${member.id})}"
                              method="post" style="margin:0;">
                            <button th:if="${member.isHard}" type="submit" class="btn-toggle toggle-warn">
                                ✕ 리더 불가
                            </button>
                            <button th:unless="${member.isHard}" type="submit" class="btn-toggle toggle-ok">
                                ✓ 리더 가능
                            </button>
                        </form>
                    </td>
                    <td class="center">
                        <form th:action="@{/member/exclude/{id}(id=${member.id})}"
                              method="post" style="margin:0;">
                            <button th:if="${member.excluded}" type="submit" class="btn-toggle toggle-warn">
                                ✕ 편성 제외
                            </button>
                            <button th:unless="${member.excluded}" type="submit" class="btn-toggle toggle-ok">
                                ✓ 편성 포함
                            </button>
                        </form>
                    </td>
                    <td class="center">
                        <form th:action="@{/member/admin/delete/{id}(id=${member.id})}"
                              method="post"
                              th:onsubmit="return confirm('정말 삭제하시겠습니까?')"
                              style="margin:0;">
                            <button type="submit" class="btn-del">
                                <i class="bi bi-trash3"></i> 삭제
                            </button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(members)}">
                    <td colspan="5" style="text-align:center; padding:56px; color:var(--ink-3); font-size:0.9rem;">
                        등록된 인원이 없습니다.
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Danger zone -->
    <div class="danger-zone">
        <div>
            <div class="danger-title">
                <i class="bi bi-exclamation-octagon-fill"></i> 전체 인원 초기화
            </div>
            <p class="danger-desc">매주 새로운 출석을 시작하기 위해 모든 인원을 삭제합니다.</p>
        </div>
        <form th:action="@{/member/clear}" method="post"
              onsubmit="return confirm('주의! 모든 출석 명단이 영구히 삭제됩니다. 정말 진행하시겠습니까?')"
              style="margin:0;">
            <button type="submit" class="btn-danger">
                <i class="bi bi-trash-fill"></i> 출석 인원 전체 삭제
            </button>
        </form>
    </div>

    <p class="admin-note">* 이 페이지는 관리자 전용입니다. 메인 화면에서는 리더 불가 정보가 노출되지 않습니다.</p>
</div>

<script th:inline="javascript">
    /*<![CDATA[*/
    var message = /*[[${message}]]*/ null;
    if (message) alert(message);
    /*]]>*/
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
