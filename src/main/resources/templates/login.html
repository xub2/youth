<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>관리자 로그인</title>
    <link rel="icon" th:href="@{/images/favicon.ico}" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" as="style" crossorigin
          href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
    <style>
        :root {
            --bg: #F2EFE9;
            --surface: #FFFFFF;
            --ink: #1A1A1A;
            --ink-2: #6B6B6B;
            --ink-3: #B5B2AD;
            --coral: #F5906A;
            --coral-10: rgba(245,144,106,0.10);
            --border: rgba(0,0,0,0.08);
            --radius: 24px;
            --radius-sm: 14px;
            --sh-lg: 0 12px 48px rgba(0,0,0,0.11);
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100dvh;
            background: var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Pretendard', -apple-system, sans-serif;
            padding: 24px;
        }

        .card {
            width: 100%;
            max-width: 400px;
            background: var(--surface);
            border-radius: var(--radius);
            box-shadow: var(--sh-lg);
            padding: 52px 40px 44px;
        }

        .logo-block {
            text-align: center;
            margin-bottom: 40px;
        }
        .logo-text {
            font-family: 'Gaegu', cursive;
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--ink);
            line-height: 1;
        }
        .logo-text em { color: var(--coral); font-style: normal; }
        .logo-eyebrow {
            display: block;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--ink-3);
            margin-top: 8px;
        }

        .form-field { margin-bottom: 14px; }
        .field-label {
            display: block;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--ink-2);
            margin-bottom: 7px;
        }
        .field-input {
            width: 100%;
            height: 50px;
            padding: 0 18px;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            background: var(--bg);
            font-family: 'Pretendard', sans-serif;
            font-size: 0.96rem;
            color: var(--ink);
            outline: none;
            transition: border-color 0.15s, box-shadow 0.15s;
        }
        .field-input::placeholder { color: var(--ink-3); }
        .field-input:focus {
            border-color: var(--coral);
            box-shadow: 0 0 0 3px var(--coral-10);
            background: var(--surface);
        }
        .field-input.is-invalid { border-color: var(--coral); }

        .invalid-msg {
            margin-top: 7px;
            font-size: 0.8rem;
            color: var(--coral);
            padding-left: 2px;
        }

        .btn-submit {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 52px;
            margin-top: 22px;
            background: var(--coral);
            color: #fff;
            border: none;
            border-radius: var(--radius-sm);
            font-family: 'Pretendard', sans-serif;
            font-weight: 700;
            font-size: 0.96rem;
            letter-spacing: 0.02em;
            cursor: pointer;
            transition: opacity 0.15s, transform 0.1s, box-shadow 0.15s;
            box-shadow: 0 4px 14px rgba(245,144,106,0.35);
        }
        .btn-submit:hover {
            opacity: 0.9;
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(245,144,106,0.4);
        }
        .btn-submit:active { transform: translateY(0); opacity: 1; }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 24px;
            font-size: 0.82rem;
            color: var(--ink-3);
            text-decoration: none;
            transition: color 0.12s;
        }
        .back-link:hover { color: var(--coral); }
    </style>
</head>
<body>
<div class="card">
    <div class="logo-block">
        <div class="logo-text">랜덤 목장 <em>편성기</em></div>
        <span class="logo-eyebrow">관리자 로그인</span>
    </div>

    <form th:action="@{/login}" method="post">
        <div class="form-field">
            <label class="field-label">아이디</label>
            <input type="text" name="username"
                   class="field-input"
                   th:classappend="${errorMessage != null} ? ' is-invalid' : ''"
                   placeholder="아이디를 입력하세요" required autocomplete="username">
        </div>
        <div class="form-field">
            <label class="field-label">비밀번호</label>
            <input type="password" name="password"
                   class="field-input"
                   th:classappend="${errorMessage != null} ? ' is-invalid' : ''"
                   placeholder="비밀번호를 입력하세요" required autocomplete="current-password">
            <div th:if="${errorMessage}" class="invalid-msg">
                [[${errorMessage}]]
            </div>
        </div>
        <button type="submit" class="btn-submit">로그인</button>
    </form>

    <a th:href="@{/}" class="back-link">← 메인으로 돌아가기</a>
</div>
</body>
</html>
